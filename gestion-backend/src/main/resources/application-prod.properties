spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/gestion_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gestion}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

gestion.semantica.ruta-tdb=/data/jena

gestion.almacenamiento.minio.endpoint=http://silo:9000
gestion.almacenamiento.minio.endpoint-publico=https://s3.mosqueteros.cloud
gestion.almacenamiento.minio.bucket=reportes
gestion.almacenamiento.minio.region=us-east-1
gestion.almacenamiento.minio.access-key=${MINIO_ROOT_USER}
gestion.almacenamiento.minio.secret-key=${MINIO_ROOT_PASSWORD}
gestion.almacenamiento.minio.expiracion-url-minutos=15

gestion.seguridad.jwt.secreto=${JWT_SECRET}
gestion.seguridad.jwt.expiracion-minutos=120
gestion.cors.origenes-permitidos=${CORS_ORIGINS:https://reportes.mosqueteros.cloud}

gestion.ia.modo=gemini
gestion.ia.gemini.api-key=${GEMINI_API_KEY}
gestion.ia.gemini.modelo=gemini-3.5-flash-lite
gestion.ia.gemini.timeout-segundos=60
gestion.ia.gemini.confianza-minima=0.60

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
