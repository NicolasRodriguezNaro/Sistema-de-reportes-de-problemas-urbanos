spring.application.name=gestion-backend
spring.profiles.active=dev
spring.jpa.open-in-view=false
gestion.semantica.ruta-tdb=data/jena
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
gestion.almacenamiento.ruta-local=uploads
gestion.almacenamiento.url-base=http://localhost:8080
gestion.seguridad.jwt.secreto=${JWT_SECRET:dev-secret-de-al-menos-32-caracteres-cambiar}
gestion.seguridad.jwt.expiracion-minutos=120
gestion.seguridad.captcha.activo=true
gestion.correo.proveedor=${CORREO_PROVEEDOR:log}
gestion.correo.brevo.url=https://api.brevo.com/v3/smtp/email
gestion.correo.brevo.api-key=${BREVO_API_KEY:}
gestion.correo.remitente-email=${CORREO_REMITENTE:no-reply@mosqueteros.cloud}
gestion.correo.remitente-nombre=${CORREO_REMITENTE_NOMBRE:Reporte Urbano}
gestion.correo.codigo.expiracion-minutos=10
gestion.cors.origenes-permitidos=http://localhost:5173,http://localhost:19006,http://localhost:8081
gestion.ia.modo=simulado
gestion.ia.gemini.api-key=${GEMINI_API_KEY:}
gestion.ia.gemini.modelo=gemini-3.5-flash-lite
gestion.ia.gemini.timeout-segundos=60
gestion.ia.gemini.confianza-minima=0.60
